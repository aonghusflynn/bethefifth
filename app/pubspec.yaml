name: bethefifth
description: "BeTheFifth — find and join five-a-side football games near you."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  google_fonts: ^6.2.1
  intl: any
  cached_network_image: ^3.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.4
  build_runner: ^2.4.14

flutter:
  generate: true
  uses-material-design: true
